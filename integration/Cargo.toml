[package]
name = "integration"
version = "0.1.0"
edition.workspace = true

[dependencies]
anyhow = "1.0"
cargo-miden = "=0.9.0"
miden-client = { version = "=0.15.2", features = ["tonic"] }
miden-client-sqlite-store = { version = "=0.15.2", package = "miden-client-sqlite-store" }
miden-protocol = "=0.15.3"
miden-standards = { version = "=0.15.3", features = ["testing"] }
miden-tx = "=0.15.3"
miden-testing = "=0.15.3"
miden-mast-package = { version = "=0.23.4", default-features = false }
tokio = { version = "1.48", features = ["rt-multi-thread", "macros"] }
