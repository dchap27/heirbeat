[package]
name = "integration"
version = "0.1.0"
edition.workspace = true

[dependencies]
anyhow = "1.0"
miden-client = { version = "=0.16.0", features = ["tonic"] }
miden-client-sqlite-store = { version = "=0.16.0", package = "miden-client-sqlite-store" }
miden-core = "=0.29.4"
miden-protocol = "=0.16.1"
miden-standards = { version = "=0.16.1", features = ["testing"] }
miden-tx = "=0.16.1"
miden-testing = "=0.16.1"
miden-mast-package = { version = "=0.29.4", default-features = false }
rand = "0.10"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros"] }
